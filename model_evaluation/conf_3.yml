# Future Days model evaluation tasks.
# Prefer environment variables for API keys.

n: 10
workers: 4
max_completion_tokens: 40000
system_prompt: >
  You are a careful logical reasoning assistant. Solve the task independently.
  Return only the requested JSON.

providers:
  - name: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  - name: google
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GOOGLE_API_KEY

models:
  - provider: openai
    name: gpt-5.4
    reasoning_effort: none
  #- provider: google
  #  name: gemini-3-flash-preview
  #  reasoning_effort: minimal
  # Add more OpenAI-compatible models here:
  # - provider: openai
  #   name: gpt-5.2-2025-12-11
  #   reasoning_effort: low

contexts:
  ypc: &ypc_context |
    Six students in the Master's degree course of Economics have founded the students' business consulting company "Young Professionals Consulting" (YPC). Now it is a question of deciding which consulting capacities should be made available for each day.

    The six consultants want to work for YPC at the following times:

    - Emily: either Tuesday mornings and Thursday afternoons, or Friday mornings and afternoons
    - Tom: Wednesday mornings and afternoons
    - Jacob: one and a half consecutive days per week
    - Lara: only in the morning, either Mondays and Tuesdays or Thursdays and Fridays
    - Ben: two afternoons per week, but not on consecutive days
    - Sara: Monday afternoons and Thursday mornings

    These capacities are to be fully utilised.

    Each of the six consultants provides all services, except for two services: only Tom and Lara offer cost cutting consulting, and only Emily and Ben offer personnel consulting.

    If the following exercises mention "week", this always refers to a working week from Mondays to Fridays.

  workroom: &workroom_context |
    A workroom at the Institute for Innovation Management is to be renovated.

    The following table lists the work processes required for the renovation. Furthermore, the table states the time needed for the individual processes and the processes that have to be completed beforehand.

    | Craftsman | Process (ID letter) | Process (name) | Time needed (hours) | Processes to be completed before |
    |---|---|---|---:|---|
    | Cabinet maker | A | transport of old furniture to adjacent room | 1hr | - |
    | Cabinet maker | B | disassembly and disposal of old furniture; assembly of new furniture in adjacent room | 6hrs | A |
    | Cabinet maker | C | transport of new furniture to workroom | 1hr | B, G, J |
    | Carpenter | D | removal of old window and installation of new window | 4hrs | A |
    | Painter and decorator | E | removal of wallpaper | 3hrs | A |
    | Painter and decorator | F | plastering of window recesses and cable ducts; drying of plaster | 10hrs | D, H |
    | Painter and decorator | G | painting of ceiling and hanging of new wallpaper; drying of ceiling and walls | 15hrs | F |
    | Electrician | H | creating cable ducts and installing electric cabling | 9hrs | E |
    | Parquet layer | J | removal of old laminate and installation of parquet | 16hrs | G |

    Renovation starts on Monday, 1 September, and is to be completed as soon as possible. Hence as many processes as possible are to be performed simultaneously - provided this meets the requirements stated in the table. Working time is from Mondays to Fridays (working week), 8 hours per day.

    In the following exercises it is to be assumed that the renovation must be finished as soon as possible, considering the given framework conditions. Breaks between consecutive processes are unproblematic unless this extends the overall renovation time.

  dog_school: &dog_school_context |
    The dog school "Wuff und Schnupper" offers classes every day of the week, as five trainers can share the work. Now the school has rented a new grass field which is available all the time. However, the coaches can only work at different times.

    - Mr Knurr (Kp): Thursday afternoon, Saturday afternoon and Sunday morning.
    - Mrs Winsel-Knurr (WKa): Monday morning and afternoon or Friday afternoon and Saturday morning.
    - Mr Bello (MB): Monday morning and Tuesday, Thursday, Saturday and Sunday afternoons respectively.
    - Mr Fass (FAp): Tuesday and Wednesday afternoons or Saturday morning and afternoon.
    - Ms Streichel (S): 4 fixed afternoons per week. She does not care which ones, but then she cannot change them.

    All trainers enjoy working with the dogs and want to supervise as many courses as they can. All courses should be supervised with as many trainers as possible. Mr Knurr can also train protection dogs, Mrs Winsel-Knurr is particularly familiar with the needs of agility dogs. Mr Fass is an all-rounder; he can look after both protection dogs and agility dogs in his courses.

    So much for the specifications. Your exercise now is to draw up a weekly schedule. Abbreviations have already been suggested for the names of the trainers. That is good; abbreviations are useful for working through each exercise.

    First, enter the trainers whose times are fixed: Mr Knurr and Mr Bello. In the case of Mr Knurr, immediately add a small "P" for protection dogs so that you do not forget this "test trap" later.

    Then enter the trainers who have defined alternatives for your use: Mrs Winsel-Knurr and Mr Fass. Put the alternatives in brackets. The small letters "A" stand for "Agility Dogs" for Mrs Winsel-Knurr and "AP" for both specialities for Mr Fass.

    Finally, enter Ms Streichel, whose appointments are defined by the plan as it stands up to this point. After all, with this you can offer a course with 2 trainers 7 times a week. This is how this optimal weekly schedule looks, from which you can answer the questions:

    | Time | Monday | Tuesday | Wednesday | Thursday | Friday | Saturday | Sunday |
    |---|---|---|---|---|---|---|---|
    | Morning | WKa; MB | - | - | - | - | (WKa); (FAp) | Kp |
    | Afternoon | WKa; S | MB; FAp | FAp; S | Kp; MB | (WKa); S | Kp; MB; (FAp) | MB; S |

    Brackets indicate alternative use.

tasks:
  - id: future_days_01
    correct: A
    question: >
      Which of the following statements regarding the student assistants is or are correct?

      1. All time capacity of the student assistants is used in consideration of their preferences.
      2. There are five student assistants who can be deployed on all three days.
    options:
      A: Only statement 1 is correct.
      B: Only statement 2 is correct.
      C: Both statements are correct.
      D: Neither of the two statements is correct.
    context: &future_days_context |
      Every year, a large corporation holds an event called "Future Days" at one of its sites that lasts several days and is intended for international applicants. This year, the event is being held from Thursday to Saturday.

      One of the tasks is to plan when which student assistant will be employed where during the Future Days event. The preferences of the student assistants are to be considered.

      Student assistants are required in two areas: the lobby and the event level, for the following tasks:

      1. Management of two information points and the registration desk in the lobby.
         One student assistant each is to be scheduled for a full day for the information points and the registration desk.

      2. Operation of the technical systems in the rooms at event level:
         Four event rooms are required on Thursday and Friday, but only three are required on Saturday. The student assistants in the three rooms used on all three days should have an excellent knowledge of the event technology, while those in the fourth room only require superficial knowledge. One student assistant per day is required for each room.

      The two student assistants Jonah and Peter have already been scheduled, who are already part of the organising committee: Jonah operates the event technology in one room at event level on Thursday and Saturday and Peter operates it on Friday, while Jonah manages an information point on Friday. Both have an excellent knowledge of the event technology.

      The following student assistants are available for the event:

      | ID | Name | Gender | Description |
      |---|---|---|---|
      | A | Alex | m | can work on all three days, would like to work once at event level, once at the registration desk and once - but not on Saturday - at the information point, has superficial knowledge of the event technology |
      | D | Daria | f | cannot work on Saturday, only wants to be included at the event level and has an excellent knowledge of the event technology |
      | L | Lara | f | would like to work on one of the weekdays (Thursday or Friday) and on Saturday, has no knowledge of the event technology |
      | M | Michael | m | can work on all three days, would like to work at event level on Friday, has superficial knowledge of the event technology |
      | R | Roberto | m | would like to work on two occasions, but not on two subsequent days, has excellent knowledge of the event technology |
      | S | Sonia | f | can work on all three days, does not want to work together with Alex in the same area (lobby or event level), has an excellent knowledge of the event technology |
      | T | Theresa | f | can only work on Friday, does not want to work at one of the information points, has a superficial knowledge of the event technology |

  - id: future_days_02
    correct: B
    question: >
      Which of the following statements for planning when considering all requirements is or are correct?

      1. Three female student assistants are working on each of the three days.
      2. The registration desk is being managed by a different student assistant on each of the three days.
    options:
      A: Only statement 1 is correct.
      B: Only statement 2 is correct.
      C: Both statements are correct.
      D: Neither of the two statements is correct.
    context: *future_days_context

  - id: future_days_03
    correct: B
    question: >
      Which of the following statements about managing the information points for planning when considering all requirements is or are correct?

      1. The same student assistants can be deployed at the information points on Thursday and Friday.
      2. The same student assistants can be deployed at the information points on Thursday and Saturday.
    options:
      A: Only statement 1 is correct.
      B: Only statement 2 is correct.
      C: Both statements are correct.
      D: Neither of the two statements is correct.
    context: *future_days_context

  - id: future_days_04
    correct: D
    question: >
      Which of the following statements about planning when considering all requirements is or are correct?

      1. Eight different student assistants in total are deployed in the event rooms on all three days.
      2. Exactly four persons are deployed on both Thursday and Friday.
    options:
      A: Only statement 1 is correct.
      B: Only statement 2 is correct.
      C: Both statements are correct.
      D: Neither of the two statements is correct.
    context: *future_days_context

  - id: future_days_05
    correct: C
    question: >
      Which of the following statements about planning when considering all requirements is or are correct?

      1. Sonia and Michael will work in the same area for at least one day.
      2. Jonah and Alex will work in the same area for at least one day.
    options:
      A: Only statement 1 is correct.
      B: Only statement 2 is correct.
      C: Both statements are correct.
      D: Neither of the two statements is correct.
    context: *future_days_context

  - id: future_days_06
    correct: C
    question: >
      Which of the following statements about planning when considering all requirements is or are correct?

      1. The two student assistants who are each working for only one day are working on the same day.
      2. None of the student assistants who have an excellent knowledge of the event technology will be deployed on all three days to operate the technical systems at event level.
    options:
      A: Only statement 1 is correct.
      B: Only statement 2 is correct.
      C: Both statements are correct.
      D: Neither of the two statements is correct.
    context: *future_days_context

  - id: ypc_01
    correct: C
    question: >
      Which of the following statements about the possible working times is or are correct?

      1. Up to three consultants can work on Monday afternoons.
      2. Two consultants can work on Friday mornings and afternoons.
    options:
      A: Only statement 1 is correct.
      B: Only statement 2 is correct.
      C: Both statements are correct.
      D: Neither of the two statements is correct.
    context: *ypc_context

  - id: ypc_02
    correct: D
    question: >
      Which of the following statements about the effects of certain working times is or are correct?

      1. If Emily, Jacob, and Lara work on Tuesdays, only two consultants will be available on Thursday mornings.
      2. If two consultants are to be available on Wednesday mornings and afternoons respectively, this will not be possible on a Friday in one and the same week.
    options:
      A: Only statement 1 is correct.
      B: Only statement 2 is correct.
      C: Both statements are correct.
      D: Neither of the two statements is correct.
    context: *ypc_context

  - id: ypc_03
    correct: B
    question: >
      Which of the following statements about possible cooperation is or are correct?

      1. If in one and the same week Ben works on Tuesday afternoon and Jacob on Thursday the whole day, there will be no one in that week to accompany Tom to an appointment if necessary.
      2. If in one and the same week a client wants to book two half-days of that week with the same consultants respectively, there will be three consultant tandems that could meet this requirement.
    options:
      A: Only statement 1 is correct.
      B: Only statement 2 is correct.
      C: Both statements are correct.
      D: Neither of the two statements is correct.
    context: *ypc_context

  - id: ypc_04
    correct: D
    question: >
      It is assumed - only for this exercise - that Jacob is off for a whole week.

      Which of the following statements is or are correct in this case?

      1. In that week, the mornings and afternoons of the five working days cannot be staffed completely.
      2. A maximum of three half-days can be staffed with two consultants in that week.
    options:
      A: Only statement 1 is correct.
      B: Only statement 2 is correct.
      C: Both statements are correct.
      D: Neither of the two statements is correct.
    context: *ypc_context

  - id: ypc_05
    correct: A
    question: >
      Which of the following statements about the consulting in the fields of cost cutting and personnel is or are correct?

      1. If each day of the working week is to be staffed with consultants in the mornings and afternoons, personnel consulting may only be offered on a maximum of three days.
      2. If not every day of the working week needs to be staffed, both cost cutting consulting and personnel consulting can be offered on four days of the week.
    options:
      A: Only statement 1 is correct.
      B: Only statement 2 is correct.
      C: Both statements are correct.
      D: Neither of the two statements is correct.
    context: *ypc_context

  - id: ypc_06
    correct: A
    question: >
      It is assumed - only for this exercise - that the resource planning has gone completely wrong, even making full use of the capacities of the six consultants.

      Which of the following statements is or are correct in this case?

      1. Up to four half-days per week may remain unstaffed.
      2. Up to three half-days per week can be respectively staffed with three consultants.
    options:
      A: Only statement 1 is correct.
      B: Only statement 2 is correct.
      C: Both statements are correct.
      D: Neither of the two statements is correct.
    context: *ypc_context
