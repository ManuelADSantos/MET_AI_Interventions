services:
  frontend:
    build:
      context: .
      dockerfile: interface-frontend/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./study.config.yml:/study.config.yml:ro
      - ./customizations/tasks:/app/public:ro
      - ./interface-frontend/src:/app/src
      - ./interface-frontend/vite.config.js:/app/vite.config.js
      - ./tests:/tests:ro
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: interface-backend/Dockerfile
    # Dev override with hot-reload; the image default (gunicorn) is what Railway runs
    command: flask run --host=0.0.0.0 --port=5001 --debug
    ports:
      - "5001:5001"
    volumes:
      - ./study.config.yml:/study.config.yml:ro
      - ./customizations/correct_answers.py:/app/correct_answers.py
      - ./interface-backend:/app
      - ./tests:/tests:ro
    environment:
      - FLASK_APP=app.py
      - DATABASE_URL=postgresql://study:study@db:5432/study
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=study
      - POSTGRES_PASSWORD=study
      - POSTGRES_DB=study
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
